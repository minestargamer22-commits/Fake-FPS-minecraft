name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Find project folder
        id: find
        run: echo "dir=$(dirname "$(find . -name build.gradle -not -path './.git/*' | head -n1)")" >> "$GITHUB_OUTPUT"
      - name: Build
        run: gradle build
        working-directory: ${{ steps.find.outputs.dir }}
      - uses: actions/upload-artifact@v4
        with:
          name: real-fps-menu
          path: |
            ${{ steps.find.outputs.dir }}/build/libs/*.jar
            !${{ steps.find.outputs.dir }}/build/libs/*-sources.jar
